<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
<title id="title">PortusSophia five modes</title>
<desc id="desc">Terms, Provenance, Limitation, Warrant, and Fellowship arranged as a relational field. Warrant carries The Joy in Earning. Fellowship carries PortusNunc, PortusHarmonia, and PortusAtlas in correspondence.</desc>
<defs>
  <radialGradient id="bg"><stop stop-color="#17344d"/><stop offset="1" stop-color="#071a2a"/></radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="900" height="760" rx="24" fill="url(#bg)"/>
<g fill="none" stroke="#c9a25f" stroke-width="1.5" opacity=".65">
  <circle cx="450" cy="400" r="280"/><circle cx="450" cy="400" r="205"/>
  <path d="M450 155 L235 330 L315 585 L585 585 L665 330 Z"/>
  <path d="M450 155 L315 585 M450 155 L585 585 M235 330 L665 330 M235 330 L585 585 M665 330 L315 585"/>
</g>
<circle cx="450" cy="400" r="8" fill="#f3d58b" filter="url(#glow)"/>
<g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
  <text x="450" y="62" fill="#f4efe5" font-size="31" letter-spacing="8">FIVE MODES</text>
  <text x="450" y="100" fill="#d9d3c9" font-size="19">PortusSophia™ models five modes.</text>

  <g>
    <circle cx="450" cy="205" r="104" fill="#102538" stroke="#e0bc70" stroke-width="2.5"/>
    <text x="450" y="198" fill="#f6f0e5" font-size="31">Terms</text>
    <path d="M430 225h40" stroke="#e0bc70"/>
  </g>
  <g>
    <circle cx="240" cy="365" r="104" fill="#102538" stroke="#86bce7" stroke-width="2.5"/>
    <text x="240" y="358" fill="#f6f0e5" font-size="29">Provenance</text>
    <path d="M220 385h40" stroke="#86bce7"/>
  </g>
  <g>
    <circle cx="660" cy="365" r="104" fill="#102538" stroke="#b9d895" stroke-width="2.5"/>
    <text x="660" y="358" fill="#f6f0e5" font-size="29">Limitation</text>
    <path d="M640 385h40" stroke="#b9d895"/>
  </g>
  <g>
    <circle cx="320" cy="590" r="112" fill="#102538" stroke="#e4a85a" stroke-width="2.5"/>
    <text x="320" y="566" fill="#f6f0e5" font-size="30">Warrant</text>
    <text x="320" y="605" fill="#e8c276" font-size="21">The Joy</text>
    <text x="320" y="632" fill="#e8c276" font-size="21">in Earning</text>
  </g>
  <g>
    <circle cx="580" cy="590" r="112" fill="#102538" stroke="#d9a9d4" stroke-width="2.5"/>
    <text x="580" y="548" fill="#f6f0e5" font-size="29">Fellowship</text>
    <text x="580" y="584" fill="#e8dce8" font-size="17">PortusNunc™ ≅</text>
    <text x="580" y="609" fill="#e8dce8" font-size="17">PortusHarmonia™ ≅</text>
    <text x="580" y="634" fill="#e8dce8" font-size="17">PortusAtlas™</text>
  </g>
</g>
</svg>